name: Keepalive (mantém o agendamento ativo)

# O GitHub desativa workflows agendados após 60 dias sem atividade no repositório.
# Este job faz um pequeno commit semanal para que o agendamento dos posts nunca
# seja desativado — assim o sistema roda indefinidamente, sem intervenção.
on:
  schedule:
    - cron: "17 5 * * 1"   # toda segunda-feira (02:17 BRT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
