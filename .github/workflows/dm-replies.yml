name: Responder comentários no direct

# Bot SEPARADO do de postagem: lê os comentários recentes dos posts e responde
# cada pessoa por DM (private reply do Instagram). Nunca fala duas vezes com a
# mesma pessoa e respeita um limite por rodada.
on:
  schedule:
    - cron: "*/30 10-23 * * *"   # a cada 30 min na janela 07:00–20:40 BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só mostrar o que enviaria, sem mandar DM"
        required: false
        type: boolean
        default: false

concurrency:
  group: dm-replies
  cancel-in-progress: false

permissions:
  contents: write   # grava state/dm.json (quem já recebeu DM)

jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Responder comentários
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DM_MAX_PER_RUN: ${{ vars.DM_MAX_PER_RUN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.dm --dry-run
          else
            python -m src.dm
          fi

      # Guarda quem já recebeu DM (mesmo se algum envio falhar).
      - name: Salvar memória de DMs
        if: ${{ always() && inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain state/dm.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/dm.json
            git commit -m "chore: memória de DMs"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 3
            done
          fi
