name: Posts diários sobre trade

# Dispara nos minutos 00 das horas 09–23 e 00–04 (UTC) = 20 execuções por dia,
# uma por hora, espaçando os 20 posts ao longo do dia (evita parecer spam e
# respeita os limites de rate das APIs). Ajuste os horários conforme seu público.
on:
  schedule:
    - cron: "0 9-23,0-4 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Tipo de post (opcional)"
        required: false
        type: choice
        options: ["", "motivacional", "mercado", "educacional"]
      dry_run:
        description: "Somente gerar, sem publicar"
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Gerar e publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE }}
          POST_HANDLE: ${{ vars.POST_HANDLE }}
          PLATFORMS: ${{ vars.PLATFORMS }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POST_TYPE: ${{ inputs.type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m src.post
