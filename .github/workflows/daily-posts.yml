name: Posts diários sobre trade

# 20 posts/dia distribuídos das 07:00 às 20:30 (horário de Brasília, UTC-3).
# Os horários abaixo estão em UTC (BRT + 3h). 2 posts do dia são de mercado
# (08:25 = Ouro, 16:14 = Nasdaq); os demais focam no trader.
# O agendador do GitHub é "best-effort" (atrasa/junta/pula horários). Por isso
# disparamos com FREQUÊNCIA (a cada 20 min na janela 07:00–20:30 BRT = 10:00–23:40
# UTC) e a lógica em src/post.py decide o que publicar: no máximo 1 post por
# disparo — o próximo slot "devendo" — só depois do horário previsto, até 20/dia.
# Assim, mesmo com o GitHub disparando torto, os posts saem espaçados e na janela.
on:
  schedule:
    - cron: "*/20 10-23 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Formato do post (opcional)"
        required: false
        type: choice
        options: ["", "trader", "mercado", "foto", "citacao", "lista", "mito_verdade", "numero"]
      dry_run:
        description: "Somente gerar, sem publicar"
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-posts
  cancel-in-progress: false

permissions:
  contents: write   # para commitar a memória de posts (state/history.json)

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo para commit/rebase da imagem e memória

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Gerar e publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE }}
          POST_HANDLE: ${{ vars.POST_HANDLE }}
          PLATFORMS: ${{ vars.PLATFORMS }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          POST_TYPE: ${{ inputs.type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m src.post

      # Grava a memória de posts (só em publicação real e se houve mudança).
      - name: Salvar memória de posts
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain state/history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/history.json
            git commit -m "chore: memória de posts"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 3
            done
          fi

      # Em modo dry_run é gerado um preview.png; deixamos disponível para download.
      - name: Salvar prévia do card (dry_run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previa-do-card
          path: preview.png
          if-no-files-found: ignore
